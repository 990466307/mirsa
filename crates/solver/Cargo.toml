[package]
name = "mirsa-solver"
version = "0.4.0"
edition = "2024"
description = "Bounded property solving for mirsa"
license = "MIT"
repository = "https://github.com/990466307/mirsa"

[features]
z3 = ["dep:z3", "dep:z3-sys"]

[dependencies]
serde = { version = "1", features = ["derive"] }
z3 = { version = "0.13.3", optional = true }
z3-sys = { version = "0.9", optional = true }
